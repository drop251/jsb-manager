name: Intégrer dosage Judo sans perdre les présences
on:
  push:
    branches: [integration/judo-dosage-et-presences-20261104]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fusionner Judo et présences avec résolution du cache PWA
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git fetch origin feat/judo-dosage-repetitions-duree-20261104
          if git merge-base --is-ancestor origin/feat/judo-dosage-repetitions-duree-20261104 HEAD; then
            echo "Judo déjà intégré"
          else
            git merge --no-commit --no-ff origin/feat/judo-dosage-repetitions-duree-20261104 || true
            NON_RESOLUS="$(git diff --name-only --diff-filter=U | grep -v '^sw.js$' || true)"
            if [ -n "$NON_RESOLUS" ]; then
              echo "Conflits non traités : $NON_RESOLUS"
              exit 1
            fi
            if git diff --name-only --diff-filter=U | grep -qx 'sw.js'; then
              git checkout --ours sw.js
            fi
            python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("var CACHE = 'jsb-manager-20261104-presences-v2';","var CACHE = 'jsb-manager-20261104-presences-et-dosage-judo-v1';")
          assert "var CACHE = 'jsb-manager-20261104-presences-et-dosage-judo-v1';" in s
          p.write_text(s,encoding='utf-8')
          PY
            git add index.html sw.js README.md tests/
            git diff --cached --check
            test "$(grep -c 'function modeDosageJudoDe' index.html)" -eq 1
            test "$(grep -c 'function estEveilJudo' index.html)" -eq 1
            grep -q "var CLE_PRES = 'jsb-presences'" index.html
            node --test tests/*.test.cjs
            git commit -m 'merge: dosages Judo et correctifs de présences préservés'
            git push origin HEAD:integration/judo-dosage-et-presences-20261104
          fi
      - name: Vérification finale des tests
        run: node --test tests/*.test.cjs
