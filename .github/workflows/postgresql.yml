name: JSB Manager - recette PostgreSQL

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jsb_ci
          POSTGRES_PASSWORD: jsb_ci_ephemeral_only
          POSTGRES_DB: jsb_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U jsb_ci -d jsb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: jsb_ci
      PGPASSWORD: jsb_ci_ephemeral_only
      PGDATABASE: jsb_ci
      PGCONNECT_TIMEOUT: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client PostgreSQL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client
      - name: Appliquer les migrations et tester le schéma
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT current_database()')" = jsb_ci
          for migration in backend/db/migrations/*.sql; do
            echo "Migration: $migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          for recipe in backend/db/tests/*.sql; do
            echo "Recette: $recipe"
            psql -X -v ON_ERROR_STOP=1 -f "$recipe"
          done
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM jsb_auth.accounts')" = 0
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM jsb_legal.acceptances')" = 0
          echo "Recette PostgreSQL réussie; aucune donnée de compte ou acceptation conservée."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le pilote PostgreSQL de recette
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/jsb-db-ci" pg@8.16.3 playwright@1.51.1
      - name: Tester les sessions avec PostgreSQL réel
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/auth.integration.cjs
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM jsb_auth.accounts')" = 0
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM jsb_auth.sessions')" = 0

      - name: Tester les quotas concurrents avec PostgreSQL réel
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/quota.integration.cjs
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM jsb_auth.quota_events')" = 0

      - name: Tester les inscriptions et confirmations avec PostgreSQL réel
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test tests/delivery-vault.test.cjs backend/db/tests/registration.integration.cjs
          for table in accounts sessions action_tokens delivery_outbox; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done

      - name: Tester les réservations de la file d'envoi PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/delivery-queue.integration.cjs
          for table in accounts action_tokens delivery_outbox; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done

      - name: Tester la lecture des catalogues publiés et leur séparation
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/catalogue.integration.cjs
          for table in releases exercises current_release; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_catalogue.$table")" = 0
          done

      - name: Tester la publication transactionnelle des catalogues
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/catalogue-publication.integration.cjs
          for table in publications releases exercises current_release; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_catalogue.$table")" = 0
          done
          for table in accounts sessions; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done

      - name: Tester le runtime HTTP et MFA avec PostgreSQL réel
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          node --test backend/db/tests/auth-runtime.integration.cjs
          for table in accounts sessions action_tokens delivery_outbox quota_events mfa_factors recovery_codes; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done

      - name: Installer Chromium et WebKit pour la recette HTTPS
        run: '"$RUNNER_TEMP/jsb-db-ci/node_modules/.bin/playwright" install --with-deps chromium webkit'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le lecteur Excel de préproduction
        run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1

      - name: Tester les écrans de connexion en HTTPS sur PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          JSB_XLSX_PYTHON="$(command -v python)" node --test backend/db/tests/auth-browser.integration.cjs
          for table in accounts sessions action_tokens delivery_outbox quota_events mfa_factors recovery_codes; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done


      - name: Tester l’initialisation du premier administrateur sur une base éphémère dédiée
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NODE_PATH: ${{ runner.temp }}/jsb-db-ci/node_modules
        run: |
          set -euo pipefail
          test "$PGDATABASE" = jsb_ci
          createdb jsb_preprod
          trap 'dropdb --if-exists jsb_preprod' EXIT
          export PGDATABASE=jsb_preprod
          for migration in backend/db/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          node --test backend/db/tests/bootstrap-admin.integration.cjs
          for table in accounts sessions mfa_factors recovery_codes; do
            test "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM jsb_auth.$table")" = 0
          done

      - name: Construire les distributions de préproduction isolées
        run: |
          set -euo pipefail
          node --test tests/build-auth-preview.test.cjs
          node scripts/build-auth-preview.cjs public "$RUNNER_TEMP/jsb-manager-auth-v36"
          node scripts/build-auth-preview.cjs admin "$RUNNER_TEMP/jsb-admin-auth-v36"
      - uses: actions/upload-artifact@v4
        with:
          name: JSB-Manager-V36-auth-preproduction
          path: ${{ runner.temp }}/jsb-manager-auth-v36/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: JSB-Admin-V36-auth-preproduction
          path: ${{ runner.temp }}/jsb-admin-auth-v36/
          if-no-files-found: error
          retention-days: 14
