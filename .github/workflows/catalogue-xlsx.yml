name: JSB Manager - inspection Excel
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xlsx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances de l’inspection Excel
        run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1
      - name: Vérifier l’inspection et la conversion sur des classeurs synthétiques
        run: python -m unittest discover -s tests -p catalogue_xlsx_inspection_test.py -v
