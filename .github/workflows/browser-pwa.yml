name: JSB Manager - recette navigateur PWA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'jsb-edge-swipe.js'
      - 'qa/browser-pwa.cjs'
      - '.github/workflows/browser-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigateur:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Installer le navigateur
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Recetter la version publique
        env:
          JSB_URL: https://drop251.github.io/jsb-manager/
          JSB_ENGINE: ${{ matrix.engine }}
        run: node qa/browser-pwa.cjs
      - name: Recetter le code de la branche
        env:
          JSB_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/jsb-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          JSB_URL=http://127.0.0.1:8765/ node qa/browser-pwa.cjs
