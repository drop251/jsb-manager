name: Validation du dosage Judo sans durée obligatoire
on:
  push:
    branches: [feat/judo-dosage-repetitions-duree-20261104]
permissions:
  contents: write
jobs:
  dosage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer la validation conditionnelle
        run: |
          if ! grep -q 'function modeDosageJudoDe' index.html; then
            python3 scripts/upgrade-judo-dosage.py
          fi
      - name: Ne pas confondre planning et effort chronométré
        run: |
          if ! grep -q "dureeBlocMin correspond au planning" index.html; then
            python3 scripts/upgrade-judo-dosage-v2.py
          fi
      - name: Ne pas confondre récupération et effort
        run: |
          if ! grep -q 'récupération n.est jamais la durée' index.html; then
            python3 scripts/upgrade-judo-dosage-v3.py
          fi
      - name: Contrôler tous les tests et les différences
        run: |
          git diff --check
          node --test tests/*.test.cjs
      - name: Enregistrer la version testée sur la branche
        run: |
          if ! git diff --quiet -- index.html sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "feat(judo): dosages repetitions duree et maximum a partir de benjamins"
            git push origin HEAD:feat/judo-dosage-repetitions-duree-20261104
          fi
