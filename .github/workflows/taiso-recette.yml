name: JSB Manager - recette générateur Taïso
on:
  pull_request:
  workflow_dispatch:
jobs:
  moteur-taiso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/generateur-taiso.cjs
