name: Inspection technique du generateur Judo
on:
  push:
    branches: [feat/judo-criteres-pedagogiques-20261104]
permissions:
  contents: read
jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner import et generation
        run: |
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read().splitlines()
          for a,b in [(3970,4165),(4650,4745),(5094,5160),(5380,5400),(5500,5580),(5580,5612)]:
            print('### SOURCE',a,b)
            for i in range(a-1,min(b,len(s))): print(f'{i+1:04d}: {s[i]}')
          PY
