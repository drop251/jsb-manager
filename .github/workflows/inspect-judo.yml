name: Inspection technique du generateur Judo
on:
  push:
    branches: [feat/judo-criteres-pedagogiques-20261104]
permissions:
  contents: read
jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner classer et champs
        run: |
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read().splitlines()
          for a,b in [(4450,4652),(5600,5640),(5165,5195)]:
            print('### SOURCE',a,b)
            for i in range(a-1,min(b,len(s))): print(f'{i+1:04d}: {s[i]}')
          PY
