name: Validation et intégration Judo pédagogique
on:
  push:
    branches: [feat/judo-criteres-pedagogiques-20261104]
permissions:
  contents: write
jobs:
  pedagogie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer les critères sur la source complète
        run: |
          if ! grep -q "function verifierNouvelExerciceJudo" index.html; then
            node scripts/upgrade-judo-pedagogie.cjs
          else
            echo "Source déjà mise à niveau."
          fi
      - name: Contrôler JavaScript et tests automatisés
        run: |
          git diff --check
          node --test tests/*.test.cjs
      - name: Enregistrer la version testée sur la branche de travail
        run: |
          if ! git diff --quiet -- index.html sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "feat(judo): integrer criteres pedagogiques et import strict"
            git push origin HEAD:feat/judo-criteres-pedagogiques-20261104
          fi
