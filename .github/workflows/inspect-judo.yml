name: Inspection technique du generateur Judo
on:
  push:
    branches: [feat/judo-criteres-pedagogiques-20261104]
permissions:
  contents: read
jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner insertion et moteur
        run: |
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read().splitlines()
          for a,b in [(4735,5020),(5150,5170),(5260,5405),(5400,5447),(5520,5585),(5595,5620)]:
            print('### SOURCE',a,b)
            for i in range(a-1,min(b,len(s))): print(f'{i+1:04d}: {s[i]}')
          PY
