name: JSB Manager - tests de fiabilite
on:
  push:
    branches:
      - main
      - ameliorations-jsb-fiabilite-generateur-20261101
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utiliser Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la syntaxe des scripts JSB
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check jsb-edge-swipe.js
          for fichier in scripts/*.cjs; do
            node --check "$fichier"
          done
          if [ -f tora/tora-mode.js ]; then
            node --check tora/tora-mode.js
          fi
      - name: Verifier tous les tests JSB (presences, sauvegardes, pedagogie, PWA)
        run: node --test tests/*.test.cjs
