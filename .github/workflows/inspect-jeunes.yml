name: Validation du générateur Judo adapté aux catégories
on:
  push:
    branches: [feat/jeunes-eveil-judo-20261104]
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Appliquer le moteur dédié aux jeunes
        run: |
          if ! grep -q 'function genererSeanceJeunes' index.html; then
            node scripts/upgrade-jeunes-judo.cjs
          fi
      - name: Valider la syntaxe et les tests existants
        run: |
          git diff --check
          node --test tests/*.test.cjs
      - name: Enregistrer le code testé
        run: |
          if ! git diff --quiet -- index.html sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "feat(judo): adapter le générateur aux jeunes"
            git push origin HEAD:feat/jeunes-eveil-judo-20261104
          fi
