        run: |
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read().splitlines()
          for a,b in [(3236,3355),(5340,5380),(5530,5577),(5805,5845),(5850,5935),(1590,1615),(2415,2437),(7190,7273)]:
