<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>JSB Admin — Aperçu V36</title><style>:root{color-scheme:light dark;--bg:#f4f5f7;--surface:#fff;--ink:#182235;--muted:#526071;--line:#d7dce3;--accent:#8a5b1b;--gold:#dab174;--nav:#1f2839;--green:#0f766e;--blue:#1d4ed8}html[data-theme=dark]{color-scheme:dark;--bg:#10151d;--surface:#1b2432;--ink:#f0f2f5;--muted:#aab5c4;--line:#354052;--accent:#e2bd84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;min-height:44px;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{background:var(--nav);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px;color:var(--gold)}header small{display:block;color:#c2cbd8}header button{background:#344256;border:1px solid #718096;border-radius:12px;color:#fff;padding:8px 12px}main{max-width:1050px;margin:auto;padding:20px 18px 110px}aside{border:1px solid var(--line);padding:12px 15px;border-radius:14px;color:var(--muted);font-size:13px;background:var(--surface)}h1{font-size:clamp(27px,5vw,40px);line-height:1.1;margin:24px 0 8px}h2{font-size:19px;margin:24px 0 12px}p{margin:0 0 12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:112px;width:100%}.card strong{font-size:20px}.card small{color:var(--muted);font-size:13px}.card .mark{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em}.card.judo,.card.taiso{color:white;border:0;min-height:148px}.card.judo{background:var(--blue)}.card.taiso{background:var(--green)}.card.judo small,.card.taiso small,.card.judo .mark,.card.taiso .mark{color:white}.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:8px 16px}.pill[aria-pressed=true]{background:var(--nav);color:white;border-color:var(--nav)}.back{border:0;background:none;color:var(--accent);padding:0 10px 0 0;font-weight:650}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:2}nav button{flex:1;max-width:180px;background:none;border:0;border-radius:10px;font-size:12px;color:var(--muted);font-weight:600}nav button[aria-current=page]{background:var(--nav);color:white}#status{min-height:20px;margin-top:16px;font-size:13px;color:var(--muted)}@media(min-width:850px){nav{position:sticky;top:0;bottom:auto;order:-1}main{padding-bottom:40px}}@media(prefers-reduced-motion:no-preference){#view{animation:enter .2s ease-out}@keyframes enter{from{opacity:.55;transform:translateX(9px)}to{opacity:1;transform:none}}}.summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:16px;border-radius:12px;margin:18px 0}.summary p{margin:4px 0 0}.summary strong{font-size:16px}.card:active{transform:scale(.985)}@media(prefers-reduced-motion:reduce){.card:active{transform:none}}/* Safe areas and one scroll surface; desktop navigation precedes content. */
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
main{width:100%;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(100px + env(safe-area-inset-bottom))}
nav{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
nav button{min-width:0;overflow-wrap:anywhere;line-height:1.2}
.card{overflow-wrap:anywhere;min-width:0}
#view h1:focus{outline:none}
@media(min-width:850px){body{display:grid;grid-template-areas:"header" "nav" "main";grid-template-rows:auto auto 1fr;min-height:100vh}header{grid-area:header}nav{grid-area:nav;position:sticky;top:0;bottom:auto;order:0}main{grid-area:main;padding-bottom:40px}}
@media(max-height:450px) and (max-width:849px){main{padding-top:12px}header{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}}
</style></head><body><header><div><strong>JSB Admin</strong><small>V36 · Aperçu 3</small></div><button id="theme" aria-label="Changer le thème">Thème</button></header><main><aside>Prototype interactif · sans connexion, données réelles, stockage ni action serveur.</aside><div id="view"></div><p id="status" role="status"></p></main><nav aria-label="Navigation principale"></nav><script>
'use strict';
const pages={"home":{"title":"Tableau de bord","desc":"Supervision de la plateforme JSB. Aucun chiffre réel n'est chargé.","items":[["accounts","Comptes plateforme","Coach et Particulier"],["stats","Statistiques","Indicateurs agrégés uniquement"],["catalogue","Catalogue de référence","Judo et Taïso"],["legal","Documents légaux","Versions et publication"],["tests","Tests des générateurs","Environnement isolé"],["maintenance","Maintenance","Sécurité et configuration"]]},"accounts":{"title":"Comptes plateforme","desc":"Gestion des métadonnées de comptes, sans accès aux clubs.","items":[["coaches","Comptes Coach","Métadonnées de plateforme uniquement"],["individuals","Comptes Particulier","Métadonnées de plateforme uniquement"],["detail","Suspension et réactivation","Actions indisponibles en prévisualisation"]]},"stats":{"title":"Statistiques","desc":"Aucune statistique réelle ni donnée individuelle de club.","items":[["detail","Comptes actifs","Non disponible"],["detail","Inscriptions","Non disponible"],["detail","Usage agrégé","Non disponible"]]},"catalogue":{"title":"Catalogue de référence","desc":"Gestion des référentiels distincts.","items":[["detail","Catalogue Judo","Non validé pour intégration","judo"],["detail","Catalogue Taïso","Import et contrôle à raccorder","taiso"]]},"legal":{"title":"Documents légaux","desc":"Aucun texte légal fictif ne sera publié.","items":[["detail","CGU","Brouillons et versions à raccorder"],["detail","Confidentialité","Brouillons et versions à raccorder"],["detail","CGV","Désactivées tant que le modèle commercial est indéfini"]]},"tests":{"title":"Tests des générateurs","desc":"Recette isolée des données des utilisateurs.","items":[["detail","Judo","Test à raccorder"],["detail","Taïso","Test à raccorder"]]},"maintenance":{"title":"Maintenance","desc":"Configuration et sécurité de la plateforme.","items":[["detail","Authentification renforcée","MFA à raccorder"],["detail","Journal administratif","À raccorder"],["theme","Accessibilité","Thème clair ou sombre"],["detail","État du serveur","Aucune connexion réelle"],["detail","Sauvegardes plateforme","Politique et accès à définir"]]},"coaches":{"title":"Comptes Coach","desc":"La liste sera disponible après connexion à l'API. Aucun licencié ni donnée de club.","items":[]},"individuals":{"title":"Comptes Particulier","desc":"La liste sera disponible après connexion à l'API. Aucun historique personnel ni séance privée.","items":[]}},tabs=[["home","Accueil"],["accounts","Comptes"],["catalogue","Catalogue"],["maintenance","Réglages"]],isPublic=false;
let profile='coach',current='home',detailTitle='',detailDesc='';const history=[];
const view=document.querySelector('#view'),status=document.querySelector('#status'),nav=document.querySelector('nav');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
function updateThemeLabel(){const button=document.querySelector('#theme'),label=document.documentElement.dataset.theme==='dark'?'Thème clair':'Thème sombre';button.textContent=label;button.setAttribute('aria-label','Activer le '+label.toLowerCase())}
function theme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';updateThemeLabel()}
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';updateThemeLabel();document.querySelector('#theme').addEventListener('click',theme);
function render(key,focus=false,back=false){
 if(isPublic&&profile==='individual'&&key==='club')key='personal';
 if(!Object.hasOwn(pages,key)&&key!=='detail')key='home';if(!back&&key!==current)history.push(current);current=key;view.replaceChildren();status.textContent='';
 if(key!=='home'){const b=el('button','‹ Retour','back');b.addEventListener('click',()=>render(history.pop()||'home',true,true));view.append(b)}
 const p=pages[key]||{title:detailTitle,desc:detailDesc,items:[]};const heading=el('h1',p.title);heading.tabIndex=-1;view.append(heading,el('p',p.desc));
 if(key==='home'){const info=el('section','','summary');info.append(el('strong','État de la plateforme'),el('p','API non raccordée · aucun indicateur réel disponible'));view.append(info)}
 const grid=el('div','','grid');let items=p.items;
 if(isPublic&&key==='home'&&profile==='individual')items=items.map(i=>i[0]==='club'?['personal','Suivi personnel','Mes entraînements et mon historique']:i);
 for(const [dest,title,desc,color] of items){const b=el('button','','card'+(color?' '+color:''));if(color)b.append(el('span',color.toUpperCase(),'mark'));b.append(el('strong',title),el('small',desc));b.addEventListener('click',()=>{if(dest==='theme'){theme();return}if(isPublic&&(dest==='coach'||dest==='individual')){setProfile(dest);return}if(dest==='detail'){detailTitle=title;detailDesc=desc;render('detail',true);status.textContent='Fonction non connectée dans cette prévisualisation.';return}render(dest,true)});grid.append(b)}
 view.append(grid);for(const b of nav.children){if(b.dataset.page===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}if(focus){heading.focus({preventScroll:true});window.scrollTo(0,0)}
}
function setProfile(p){if(!isPublic||!['coach','individual'].includes(p))return;profile=p;history.length=0;for(const b of document.querySelectorAll('[data-profile]'))b.setAttribute('aria-pressed',String(b.dataset.profile===p));render('home',true,true);status.textContent='Profil de démonstration : '+(p==='coach'?'Coach':'Particulier')+'. Aucune session réelle.'}
for(const b of document.querySelectorAll('[data-profile]'))b.addEventListener('click',()=>setProfile(b.dataset.profile));
for(const [key,label] of tabs){const b=el('button',label);b.dataset.page=key;b.addEventListener('click',()=>{history.length=0;render(key,true,true)});nav.append(b)}render('home');
</script></body></html>
