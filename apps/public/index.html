<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>JSB Manager — Aperçu V36</title><style>:root{color-scheme:light dark;--bg:#f4f5f7;--surface:#fff;--ink:#182235;--muted:#526071;--line:#d7dce3;--accent:#8a5b1b;--gold:#dab174;--nav:#1f2839;--green:#0f766e;--blue:#1d4ed8}html[data-theme=dark]{color-scheme:dark;--bg:#10151d;--surface:#1b2432;--ink:#f0f2f5;--muted:#aab5c4;--line:#354052;--accent:#e2bd84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;min-height:44px;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{background:var(--nav);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px;color:var(--gold)}header small{display:block;color:#c2cbd8}header button{background:#344256;border:1px solid #718096;border-radius:12px;color:#fff;padding:8px 12px}main{max-width:1050px;margin:auto;padding:20px 18px 110px}aside{border:1px solid var(--line);padding:12px 15px;border-radius:14px;color:var(--muted);font-size:13px;background:var(--surface)}h1{font-size:clamp(27px,5vw,40px);line-height:1.1;margin:24px 0 8px}h2{font-size:19px;margin:24px 0 12px}p{margin:0 0 12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:112px;width:100%}.card strong{font-size:20px}.card small{color:var(--muted);font-size:13px}.card .mark{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em}.card.judo,.card.taiso{color:white;border:0;min-height:148px}.card.judo{background:var(--blue)}.card.taiso{background:var(--green)}.card.judo small,.card.taiso small,.card.judo .mark,.card.taiso .mark{color:white}.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:8px 16px}.pill[aria-pressed=true]{background:var(--nav);color:white;border-color:var(--nav)}.back{border:0;background:none;color:var(--accent);padding:0 10px 0 0;font-weight:650}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:2}nav button{flex:1;max-width:180px;background:none;border:0;border-radius:10px;font-size:12px;color:var(--muted);font-weight:600}nav button[aria-current=page]{background:var(--nav);color:white}#status{min-height:20px;margin-top:16px;font-size:13px;color:var(--muted)}@media(min-width:850px){nav{position:sticky;top:0;bottom:auto;order:-1}main{padding-bottom:40px}}@media(prefers-reduced-motion:no-preference){#view{animation:enter .2s ease-out}@keyframes enter{from{opacity:.55;transform:translateX(9px)}to{opacity:1;transform:none}}}.summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:16px;border-radius:12px;margin:18px 0}.summary p{margin:4px 0 0}.summary strong{font-size:16px}.card:active{transform:scale(.985)}@media(prefers-reduced-motion:reduce){.card:active{transform:none}}</style></head><body><header><div><strong>JSB Manager</strong><small>V36 · Aperçu 2</small></div><button id="theme" aria-label="Changer le thème">Thème</button></header><main><aside>Prototype interactif · sans connexion, données réelles, stockage ni action serveur.</aside><div class="row" aria-label="Profil de démonstration"><button class="pill" data-profile="coach" aria-pressed="true">Coach</button><button class="pill" data-profile="individual" aria-pressed="false">Particulier</button></div><div id="view"></div><p id="status" role="status"></p></main><nav aria-label="Navigation principale"></nav><script>
'use strict';
const pages={"home":{"title":"Mon espace","desc":"Préparer, organiser et suivre mes entraînements.","items":[["judo","Judo","Exercices et séances propres au judo","judo"],["taiso","Taïso","Renforcement et préparation physique","taiso"],["club","Gestion du club","Licenciés, présences et planning"],["settings","Réglages","Profil, thème et comptes"]]},"judo":{"title":"Judo","desc":"Catalogue spécifique et préparation pédagogique. Base Judo non validée pour intégration.","items":[["detail","Catalogue Judo","En cours de construction"],["detail","Préparer une séance Judo","Générateur à raccorder"],["detail","Mes séances Judo","Stockage privé à raccorder"]]},"taiso":{"title":"Taïso","desc":"Préparation physique et renforcement musculaire.","items":[["detail","Catalogue Taïso","Catalogue de référence à raccorder"],["detail","Préparer une séance Taïso","Générateur à raccorder"],["detail","Mes séances Taïso","Stockage privé à raccorder"]]},"club":{"title":"Gestion du club","desc":"Espace réservé au profil Coach.","items":[["detail","Licenciés","Données non chargées"],["detail","Présences","Données non chargées"],["detail","Bilans","Données non chargées"],["detail","Planning","Données non chargées"]]},"personal":{"title":"Suivi personnel","desc":"Mon activité et mes entraînements, sans données de club.","items":[["detail","Historique personnel","Stockage à raccorder"]]},"settings":{"title":"Réglages","desc":"Personnaliser mon espace.","items":[["accounts","Gestion des comptes","Créer, ajouter ou changer de compte"],["theme","Accessibilité","Thème clair ou sombre"],["detail","Documents légaux","Aucun document juridique publié"]]},"accounts":{"title":"Gestion des comptes","desc":"Démonstration du parcours. Aucun compte réel ni mot de passe demandé.","items":[["switch","Changer de compte","Choisir un autre profil de démonstration"],["add","Ajouter un compte","Parcours de connexion"],["create","Créer un nouveau compte","Choisir Coach ou Particulier"],["detail","Retirer un compte de l’appareil","Ne supprime pas le compte distant"],["detail","Se déconnecter","Session réelle indisponible"],["detail","Se déconnecter de tous les comptes","Action sur cet appareil uniquement"],["detail","Supprimer définitivement un compte","Parcours séparé, confirmation et réauthentification"]]},"switch":{"title":"Changer de compte","desc":"Sélectionner un profil de démonstration. Aucun compte réel n'est connecté.","items":[["coach","Coach","Espace club et entraînements"],["individual","Particulier","Entraînements et suivi personnel"]]},"add":{"title":"Ajouter un compte","desc":"La connexion sécurisée sera raccordée au serveur. Ne saisissez aucun identifiant réel dans cet aperçu.","items":[]},"create":{"title":"Créer un compte","desc":"Choisir le profil souhaité avant l'inscription. Aucun compte réel ne sera créé dans cette prévisualisation.","items":[["detail","Compte Coach","Inscription et confirmation e-mail à raccorder"],["detail","Compte Particulier","Inscription et confirmation e-mail à raccorder"]]}},tabs=[["home","Accueil"],["judo","Judo"],["taiso","Taïso"],["settings","Réglages"]],isPublic=true;
let profile='coach',current='home',detailTitle='',detailDesc='';const history=[];
const view=document.querySelector('#view'),status=document.querySelector('#status'),nav=document.querySelector('nav');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
function theme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';document.querySelector('#theme').textContent=root.dataset.theme==='dark'?'Thème clair':'Thème sombre'}
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.querySelector('#theme').addEventListener('click',theme);
function render(key,focus=false,back=false){
 if(isPublic&&profile==='individual'&&key==='club')key='personal';
 if(!Object.hasOwn(pages,key)&&key!=='detail')key='home';if(!back&&key!==current)history.push(current);current=key;view.replaceChildren();status.textContent='';
 if(key!=='home'){const b=el('button','‹ Retour','back');b.addEventListener('click',()=>render(history.pop()||'home',true,true));view.append(b)}
 const p=pages[key]||{title:detailTitle,desc:detailDesc,items:[]};const heading=el('h1',p.title);heading.tabIndex=-1;view.append(heading,el('p',p.desc));
 if(key==='accounts'){const info=el('section','','summary');info.append(el('strong','Profil actif en démonstration'),el('p',profile==='coach'?'Coach':'Particulier'));view.append(info)}
 const grid=el('div','','grid');let items=p.items;
 if(isPublic&&key==='home'&&profile==='individual')items=items.map(i=>i[0]==='club'?['personal','Suivi personnel','Mes entraînements et mon historique']:i);
 for(const [dest,title,desc,color] of items){const b=el('button','','card'+(color?' '+color:''));if(color)b.append(el('span',color.toUpperCase(),'mark'));b.append(el('strong',title),el('small',desc));b.addEventListener('click',()=>{if(dest==='theme'){theme();return}if(isPublic&&(dest==='coach'||dest==='individual')){setProfile(dest);return}if(dest==='detail'){detailTitle=title;detailDesc=desc;render('detail',true);status.textContent='Fonction non connectée dans cette prévisualisation.';return}render(dest,true)});grid.append(b)}
 view.append(grid);for(const b of nav.children){if(b.dataset.page===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}if(focus){heading.focus();window.scrollTo(0,0)}
}
function setProfile(p){if(!isPublic||!['coach','individual'].includes(p))return;profile=p;history.length=0;for(const b of document.querySelectorAll('[data-profile]'))b.setAttribute('aria-pressed',String(b.dataset.profile===p));render('home',true,true);status.textContent='Profil de démonstration : '+(p==='coach'?'Coach':'Particulier')+'. Aucune session réelle.'}
for(const b of document.querySelectorAll('[data-profile]'))b.addEventListener('click',()=>setProfile(b.dataset.profile));
for(const [key,label] of tabs){const b=el('button',label);b.dataset.page=key;b.addEventListener('click',()=>{history.length=0;render(key,true,true)});nav.append(b)}render('home');
</script></body></html>
