.alerte-suivi { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: var(--h-ctrl); padding: var(--e3) var(--e4); border-radius: var(--r-m);
  border: 1px solid var(--ko-bord); background: color-mix(in srgb, var(--ko-bord) 8%, var(--surface)); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.alerte-suivi b { color: var(--ko-t); }
.alerte-suivi span { font-size: var(--t-s); color: var(--muted); }
/* Présences : à surveiller, fiche de suivi */
.pr-alerte { display: flex; flex-direction: column; gap: var(--e2); padding: var(--e3); border-radius: var(--r-m); border: 1px solid var(--ko-bord); background: color-mix(in srgb, var(--ko-bord) 6%, var(--surface)); }
.pr-alerte strong { color: var(--ko-t); font-size: var(--t-s); }
.pr-alerte ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--e2); }
.pr-alerte li { display: flex; align-items: center; justify-content: space-between; gap: var(--e2); font-size: var(--t-s); }
.pr-suivi .pr-suivi-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pr .pr-suivi .pr-suivi-stats { display: grid; }
.cx-version { color: var(--muted); }
/* Bandeau « Nouvelle version » : en haut, bien visible */
#maj-dispo { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: auto !important; background: var(--creme) !important; color: var(--nuit) !important; border: 2px solid var(--nuit); font-size: 1rem; box-shadow: 0 10px 30px rgba(15, 20, 30, .35); }
#maj-dispo button { background: var(--nuit) !important; color: var(--creme) !important; min-height: 44px; font-size: 1rem; }
.cours-jour .cs-btn.plein { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pr-suivi p { margin: 0; }
.pr-alerte details > summary { min-height: var(--h-mini); display: flex; align-items: center; cursor: pointer; font-weight: 600; font-size: var(--t-s); }
/* ===== Mes séances, séance en direct, accueil allégé, tablette (16/10/2026) ===== */
.ms { display: flex; flex-direction: column; gap: var(--e3); }
.ms-h { margin: var(--e3) 0 0; font-family: var(--display); font-size: var(--t-l); }
.ms-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.ms-ligne { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e2) var(--e3); padding: var(--e3); }
.ms-ligne + .ms-ligne { border-top: 1px solid var(--line); }
.ms-ligne.prevue { box-shadow: inset 4px 0 0 var(--ok-bord); }
.ms-texte { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px; }
.ms-texte span { font-size: var(--t-s); color: var(--muted); }
.ms-ligne.prevue .ms-texte span { color: var(--ok-t); font-weight: 600; }
.ms-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ms-filtres { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.ms-filtres label { display: flex; flex: 1 1 160px; flex-direction: column; gap: 6px; font-size: 14px; }
.ms-filtres input, .ms-filtres select { width: 100%; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.ms-actions .cs-btn.plein, .cours-jour .cs-btn.plein { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ms-tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e3); }
.ms-tuile { display: flex; flex-direction: column; gap: 4px; padding: var(--e3); border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.ms-tuile b { font-family: var(--display); font-size: var(--t-l); }
.ms-tuile span { font-size: var(--t-s); color: var(--muted); }
.ms-vide { margin: 0; font-size: var(--t-s); color: var(--muted); }
.ms-fiche { margin-top: var(--e3); border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); padding: 0 var(--e3) var(--e2); }
.ms-fiche > summary { min-height: var(--h-ctrl); display: flex; align-items: center; cursor: pointer; font-weight: 700; }
.ms-fiche[open] { padding-bottom: var(--e4); }

/* Séance en direct : plein écran, lisible à 2 m */
.sd { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: var(--nuit); color: var(--creme);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.sd.flash { animation: sd-flash .6s ease-out; }
@keyframes sd-flash { 0% { background: #2E6B47; } 100% { background: var(--nuit); } }
@media (prefers-reduced-motion: reduce) { .sd.flash { animation: none; } }
.sd-haut { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3); font-size: var(--t-s); font-weight: 600; color: var(--argent); }
.sd-quitter { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(244, 245, 239, .35); background: none; color: var(--creme); font-size: 1.25rem; cursor: pointer; }
.sd-progres { height: 4px; margin: 8px 0 0; border-radius: 2px; background: rgba(244, 245, 239, .18); overflow: hidden; }
.sd-progres i { display: block; height: 100%; background: var(--creme); transform-origin: 0 50%; transition: transform .3s; }
.sd-centre { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: var(--e3); text-align: center; padding: var(--e3) 0; }
.sd-phase { margin: 0; font-size: var(--t-s); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--argent); }
.sd-nom { margin: 0; font-family: var(--display); font-size: min(2.25rem, 9vw); line-height: 1.1; max-width: 22ch; }
.sd-dosage { margin: 0; font-size: 1.125rem; font-weight: 700; }
.sd-minuteur { position: relative; width: min(60vw, 260px); aspect-ratio: 1; }
.sd-minuteur svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.sd-fond { fill: none; stroke: rgba(244, 245, 239, .15); stroke-width: 8; }
.sd-reste { fill: none; stroke: var(--creme); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.sd-temps { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: min(4rem, 16vw); font-weight: 800; font-variant-numeric: tabular-nums; }
.sd-sans { margin: 0; font-size: 1rem; color: var(--argent); }
.sd-consigne { margin: 0; max-width: 46ch; font-size: 1rem; line-height: 1.45; color: rgba(244, 245, 239, .9); }
.sd-vigilance { margin: 0; max-width: 46ch; font-size: .9375rem; font-weight: 600; color: #F5C26B; }
.sd-ensuite { margin: 0; font-size: .9375rem; color: var(--argent); }
.sd-commandes { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: var(--e2); }
.sd-btn { min-height: 64px; border-radius: var(--r-m); border: 1px solid rgba(244, 245, 239, .35); background: rgba(244, 245, 239, .08); color: var(--creme); font: inherit; font-size: 1.0625rem; font-weight: 700; cursor: pointer; }
.sd-btn.principal { background: var(--creme); color: var(--nuit); border-color: var(--creme); }
.sd-btn:disabled { opacity: .4; }
.sd-btn:focus-visible, .sd-quitter:focus-visible { outline: 3px solid var(--creme); outline-offset: 2px; }
.sd-fin { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--e3); text-align: center; }
.sd-fin strong { font-family: var(--display); font-size: 2rem; }
.sd-fin .sd-btn { min-width: 200px; }
.cs-lancer { font-weight: 700; }

/* Accueil allégé : raccourcis compacts (la barre d'onglets mène déjà aux sections) */
.blocs.raccourcis { grid-template-columns: 1fr 1fr; }
.blocs.raccourcis .bloc { padding: var(--e3); grid-template-areas: "ico nb" "nom nom"; grid-template-columns: auto 1fr; row-gap: var(--e2); min-height: 0; }
.blocs.raccourcis .bloc-txt, .blocs.raccourcis .bloc-sous { display: none; }
.blocs.raccourcis .bloc-nom { font-size: 1.0625rem; }
.blocs.raccourcis .bloc-nb { justify-self: end; font-size: var(--t-xs); color: var(--muted); }
.blocs.raccourcis .bloc-ico { width: 40px; height: 40px; }

/* Ajouter des exercices : le bouton d'abord, les explications repliées */
.gestion-principal .btn.plein { min-height: var(--h-ctrl); background: var(--ink); color: var(--bg); border-color: var(--ink); }
.gestion-plus > summary { min-height: var(--h-mini); display: flex; align-items: center; cursor: pointer; font-weight: 600; font-size: var(--t-s); color: var(--muted); }

/* Tablette et ordinateur : fiche à côté de la liste */
@media (min-width: 900px) {
  body.fiche-ouverte .page { padding-right: min(480px, 45vw); transition: padding-right .2s; }
  .voile.voile-fiche { background: transparent; pointer-events: none; animation: none; }
  .voile.voile-fiche .sheet { pointer-events: auto; width: min(480px, 45vw); box-shadow: -10px 0 30px rgba(15, 20, 30, .14); border-left: 1px solid var(--line); }
}
.cs-cours-aide { flex: 1 1 100%; margin: 0; font-size: var(--t-s); color: var(--muted); }
.pr-essai { margin-left: 4px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)) !important; color: var(--warn) !important; }

/* Séance en direct (20/10/2026) : vidéo au centre, rectangle temps + répétitions dessous */
.sd-media { width: min(100%, 720px); display: flex; justify-content: center; }
.sd-media .video-exo.grand { width: 100%; max-height: 36vh; }
.sd-illus { width: min(100%, 420px); border-radius: var(--r-m); background: #F7F8F4; padding: 8px; color: #1F2839; }
.sd-illus .illus { width: 100%; max-height: 26vh; object-fit: contain; color: #1F2839; }
.sd-mesures { width: min(100%, 720px); display: grid; grid-template-columns: 1fr 1fr; border: 2px solid rgba(244, 245, 239, .35); border-radius: var(--r-m); overflow: hidden; background: rgba(244, 245, 239, .06); }
.sd-mesure { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 10px; min-height: 108px; }
.sd-mesure + .sd-mesure { border-left: 2px solid rgba(244, 245, 239, .25); }
.sd-m-etiq { font-size: .8125rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--argent); }
.sd-mesures .sd-temps { position: static; display: block; font-family: var(--display); font-size: min(3rem, 12vw); line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.sd-m-val { font-family: var(--display); font-size: min(1.75rem, 7vw); line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
.sd-m-note { font-size: .8125rem; color: var(--argent); }
.sd-barre { width: 100%; max-width: 220px; height: 8px; border-radius: 4px; background: rgba(244, 245, 239, .18); overflow: hidden; margin-top: 4px; }
.sd-barre i { display: block; height: 100%; background: var(--creme); transform-origin: 0 50%; transition: transform .25s linear; }
@media (prefers-reduced-motion: reduce) { .sd-barre i { transition: none; } }
.sd .etapes.compact { width: min(100%, 720px); }
.sd-centre > * { flex: none; }
.sd-m-val { text-wrap: balance; }
.sd-mesures.repos { border-color: #F5C26B; background: rgba(245, 194, 107, .12); }
.sd-mesures.repos .sd-m-temps .sd-m-etiq { color: #F5C26B; }
.sd-reps { font-size: min(2.25rem, 9vw); }
.sd-liste { margin: 0; padding-left: 1.4em; text-align: left; font-size: 1rem; line-height: 1.5; }
.sd-voix { margin-left: auto; margin-right: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(244, 245, 239, .35); background: none; color: var(--creme); font: inherit; font-size: .875rem; font-weight: 700; cursor: pointer; }
.sd-voix[aria-pressed="true"] { background: var(--creme); color: var(--nuit); }
.sd-quitter, .sd-voix { flex: none; }
.sd-haut > span { flex: 1 1 120px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ===== Vidéos d'exercices (20/10/2026) ===== */
.video-exo { display: block; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 16 / 9; height: auto; border-radius: 12px; background: #0E1A2E; object-fit: contain; }
.sheet .illus-fiche:has(.video-exo) { padding: 0; overflow: hidden; background: #0E1A2E; }
.video-exo.attente { position: relative; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; }
.video-exo.attente img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .55; }
.video-exo.attente span { position: relative; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: .9rem; }
.video-exo.grand { width: min(100%, 720px); max-height: 38vh; }
.video-barre { margin-top: 6px; }
.video-ajout { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.video-ajout input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.video-info { color: var(--muted); font-size: .85rem; align-self: center; }
.gestion-videos { margin: 8px 0 0; padding-left: 1.2em; }
.gestion-videos li { margin: 2px 0; }
.tag.video { background: #0E1A2E; color: #fff; }
@media (orientation: landscape) and (max-height: 520px) { .video-exo.grand { max-height: 46vh; } }
/* ===== Étape par étape (fiche animée JSB) ===== */
.etapes { --et-fond: #11203A; --et-carte: #18305A; --et-or: #E2B157; container-type: inline-size; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--et-fond); color: #F4F5EF; text-align: left; width: 100%; }
.et-haut { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--et-or); }
.et-titre { display: block; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; }
.et-sous { display: block; font-size: .78rem; color: #E8D6AE; }
.et-logo { width: 36px; height: 36px; border-radius: 50%; background: #fff; flex: none; }
.et-corps { display: grid; gap: 10px; }
.et-visuel { border: 2px solid var(--et-or); border-radius: 10px; background: #F7F8F4; display: flex; align-items: center; justify-content: center; overflow: hidden; max-height: 180px; }
.et-visuel .illus { max-height: 176px; width: 100%; object-fit: contain; color: #1F2839; }
.et-carte { background: var(--et-carte); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 9.5em; }
.et-num-l { display: flex; align-items: center; gap: 10px; }
.et-num { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--et-or); color: #11203A; font-weight: 800; flex: none; }
.et-compte { font-size: .8rem; color: #E8D6AE; }
.et-etape-titre { text-transform: uppercase; letter-spacing: .03em; font-size: .9rem; }
.et-texte { margin: 0; font-size: 1.02rem; line-height: 1.4; font-weight: 600; }
.et-vigil { background: rgba(255,255,255,.08); border-radius: 8px; padding: 8px 10px; }
.et-vigil span { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--et-or); }
.et-vigil p { margin: 2px 0 0; font-size: .88rem; }
.et-pied { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.et-infos { font-size: .82rem; color: #E8D6AE; font-weight: 700; flex: 1 1 12em; }
.et-commandes { display: flex; gap: 8px; margin-left: auto; }
.et-btn { min-width: 44px; min-height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font-size: 1.15rem; font-weight: 700; cursor: pointer; }
.et-btn:focus-visible { outline: 3px solid var(--et-or); outline-offset: 2px; }
.et-progres { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
.et-progres i { display: block; height: 100%; background: var(--et-or); transform-origin: left; transition: transform .3s; }
[data-anim="reduit"] .et-progres i { transition: none; }
@container (min-width: 520px) { .et-corps { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .et-visuel { max-height: none; } .et-visuel .illus { max-height: 240px; } }
.etapes.compact { width: min(100%, 560px); }
.etapes.compact .et-carte { min-height: 7em; }
.sheet .illus-fiche:has(.etapes) { padding: 0; background: transparent; }
.etapes-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
/* ===== Typographie (24/10/2026) : texte lissé, tailles plus sobres, aucun mot coupé =====
   Chargé en dernier : prend le pas sur les règles de césure (hyphens, overflow-wrap: anywhere) des modules précédents. */
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; font-kerning: normal; }
*, *::before, *::after { -webkit-hyphens: manual !important; hyphens: manual !important; word-break: normal !important; }
h1, h2, h3, .hero h1, .sheet h2, .gn h2, .cs-haut h2, .rg h2, .st-phases b, .pr-nomf, .sd-m-val, .sd-nom, .carte-nom, .et-titre, .pr-creneaux .pr-mini, .pr-choix .pr-mini { overflow-wrap: normal !important; }
h1, h2, h3, .sd-nom, .carte-nom, .et-titre, .sd-m-val { text-wrap: balance; }
p, li, dd, .et-texte, .sd-consigne, .sd-vigilance { text-wrap: pretty; }
/* Grands titres : plus sobres */
h1, .hero h1 { font-size: min(var(--t-xxl), 44px); letter-spacing: -.01em; }
@media (max-width: 420px) { h1, .hero h1 { font-size: min(1.875rem, 40px); } }
.sheet h2 { font-size: min(1.75rem, 7.2vw); line-height: 1.08; letter-spacing: -.005em; }
/* Séance en direct : hiérarchie resserrée, rien ne déborde ni ne se coupe */
.sd-phase { font-size: .8125rem; }
.sd-nom { font-size: min(1.75rem, 7vw); line-height: 1.12; max-width: 24ch; }
.sd-mesure { min-height: 92px; padding: 10px 8px; }
.sd-m-etiq { font-size: .75rem; }
.sd-mesures .sd-temps { font-size: min(2.5rem, 10.5vw); }
.sd-m-val { font-size: min(1.25rem, 5.4vw); line-height: 1.2; }
.sd-reps { font-size: min(1.5rem, 6.2vw); }
.sd-m-note { font-size: .75rem; }
.sd-consigne { font-size: .9375rem; }
.sd-vigilance { font-size: .875rem; line-height: 1.4; max-width: 52ch; }
.sd-ensuite { font-size: .875rem; }
.sd-btn { min-height: 56px; padding: 0 10px; font-size: .9375rem; white-space: nowrap; }
.sd-fin strong { font-size: 1.625rem; }
.sd-haut { font-size: .8125rem; }
/* Fiche animée : un cran plus discret */
.et-texte { font-size: .9375rem; }
.et-titre { font-size: .9375rem; }
/* Fiche : texte courant un cran plus petit, interligne confortable */
.sheet p, .sheet .faits dd, .sheet .desc-partie p, .sheet .securite dd { font-size: .9375rem; line-height: 1.5; }
.sheet .etiq { font-size: .8125rem; }
.sheet .cs-btn.mini { font-size: .875rem; }
.sheet .pastille { font-size: .8125rem; }
/* Raccourci « Avec vidéo » dans la barre du compte */
.barre-compte { flex-wrap: wrap; row-gap: 8px; }
.barre-compte .compte { white-space: nowrap; }
.barre-compte .illus-raccourci { flex: none; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; white-space: nowrap; }
.barre-compte .vue-choix { flex: none; }
.barre-compte .illus-raccourci[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* Exercices réservés (code du club) : cartes floutées sans contenu réel */
.verrou { position: relative; margin: 16px 0 8px; border-radius: var(--r-m, 12px); overflow: hidden; }
.verrou-cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; filter: blur(7px); opacity: .7; pointer-events: none; user-select: none; }
.verrou-carte { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface, #fff); border: 1px solid var(--line, #ddd); }
.verrou-carte .v-img { display: block; height: 70px; border-radius: 8px; background: linear-gradient(135deg, #1F2839, #3B4A66); }
.verrou-carte .v-img.v1 { background: linear-gradient(135deg, #C8382E, #F08A24); }
.verrou-carte .v-img.v2 { background: linear-gradient(135deg, #A9B8A4, #2F5DA8); }
.verrou-carte .v-l1, .verrou-carte .v-l2 { display: block; height: 10px; border-radius: 5px; background: var(--ink, #1F2839); opacity: .55; }
.verrou-carte .v-l2 { width: 60%; opacity: .3; }
.verrou-carte .v-cadenas { position: absolute; top: 8px; right: 10px; }
.verrou-boite { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 16px; background: color-mix(in srgb, var(--bg, #F4F5EF) 72%, transparent); }
.verrou-boite h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; line-height: 1.2; }
.verrou-boite p { margin: 0; font-size: .9375rem; max-width: 46ch; }
.verrou-form { display: flex; flex-wrap: wrap; gap: 8px; }
.verrou-form input { flex: 1 1 10em; min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line, #ccc); background: var(--surface, #fff); color: var(--ink); font: inherit; letter-spacing: .08em; text-transform: uppercase; }
.verrou-form .btn { flex: none; min-height: 48px; }
.verrou-msg { font-weight: 600; }
.verrou-ouvert { margin: 12px 0; font-size: .875rem; color: var(--muted); }
/* Mon compte */
.compte { display: flex; flex-direction: column; gap: 18px; }
.compte-bloc { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.compte-bloc h3 { margin: 0; font-family: var(--display); font-size: 1.125rem; }
.compte-bloc p { margin: 0; font-size: .9375rem; line-height: 1.5; }
.compte-note { color: var(--muted); font-size: .875rem !important; }
.compte-chiffres { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.compte-chiffres li { padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: .875rem; }
.compte-chiffres b { display: block; font-family: var(--display); font-size: 1.375rem; line-height: 1.1; }
.compte-danger { border-top-color: color-mix(in srgb, #B42318 40%, var(--line)); }
.compte-danger h3 { color: #B42318; }
.compte-danger input { min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; letter-spacing: .06em; }
.compte-suppr-btn:not(:disabled) { background: #B42318 !important; border-color: #B42318 !important; color: #fff !important; }
:root[data-theme="dark"] .compte-danger h3 { color: #F97066; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .compte-danger h3 { color: #F97066; } }
.compte-etiq { font-weight: 700; font-size: .9375rem; }
.cx-menu .cx-menu-suppr { color: #B42318; }
:root[data-theme="dark"] .cx-menu .cx-menu-suppr { color: #F97066; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cx-menu .cx-menu-suppr { color: #F97066; } }
.compte .cs-btn.plein, .rg .cs-btn.plein { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.compte .cs-btn.plein:disabled { opacity: .55; }
/* Séance type : onglets Judo / Taïso */
.st-onglets { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--chip); margin: 4px 0 12px; }
.st-onglets .vue-btn { min-height: 44px; padding: 0 18px; }
/* Générateur Taïso : formats et blocs du corps de séance */
.gn-formats { display: flex; flex-direction: column; gap: 6px; }
.gn-formats .gn-durees { flex-wrap: wrap; }
.gn-bloc { margin: 8px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.gn-bloc-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gn-bloc-tete b { font-size: .9375rem; }
.gn-bloc-detail { margin: 4px 0 6px; font-size: .8125rem; color: var(--muted); line-height: 1.4; }
.gn-bloc ul { margin: 0; }
.gn-materiel { margin: 4px 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: .875rem; line-height: 1.45; }
/* Générateur : écran unique (Taïso) et retouches de la séance proposée */
.gn-unique { gap: 14px; }
.gn-q { display: flex; flex-direction: column; gap: 6px; }
.gn-q h3 { margin: 0; font-size: .9375rem; font-weight: 800; }
.gn-entete-prepa { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; position: sticky; top: -20px; z-index: 2; background: var(--surface); padding: 10px 0; }
.gn-entete-prepa h2 { flex: 1 1 210px; }
.gn-annuler { flex: none; min-height: 44px; }
.gn-erreur { padding: 10px 12px; border: 1px solid var(--warn); border-radius: 10px; color: var(--warn); font-weight: 600; }
.cs-annuler-prepa { border-color: var(--warn); }
.gn-avances { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--bg); }
.gn-avances > summary { list-style-position: inside; cursor: pointer; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; font-weight: 700; }
.gn-avances > summary small { color: var(--muted); font-size: .8125rem; font-weight: 500; }
.gn-avances[open] { padding-bottom: 12px; }
.gn-avances .gn-q { margin-top: 8px; }
.gn-alternatives { padding: 10px; margin: 4px 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.gn-alternatives > strong { display: block; margin-bottom: 8px; font-size: .875rem; }
.gn-alternatives ul { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.gn-alternatives ul li { border: none; padding: 0; }
.gn-alternatives .gn-alt { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-height: 44px; }
.gn-alternatives .gn-alt small { color: var(--muted); font-size: .8125rem; font-weight: 400; }
.gn-alternatives .cs-btn { margin-top: 8px; }
.gn-choix.gn-chips { display: flex !important; flex-direction: row !important; flex-wrap: wrap; gap: 6px; grid-template-columns: none; }
.gn-choix.gn-chips .gn-option { width: auto !important; justify-content: center; gap: 8px; flex: 0 0 auto; min-height: 44px; padding: 0 14px; }
.gn-exo { list-style: none; }
.gn-exo-l { display: flex; align-items: center; gap: 4px; }
.gn-exo-nom { flex: 1 1 auto; min-width: 0; min-height: 44px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 4px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.gn-exo-nom small { color: var(--muted); font-size: .8125rem; }
.gn-exo-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.05rem; cursor: pointer; }
.gn-exo-fiche { margin: 0 0 8px 4px; padding: 8px 10px; border-left: 3px solid var(--line); font-size: .875rem; line-height: 1.45; }
.gn-exo-fiche p { margin: 0 0 4px; }
.gn-exo-vig { color: var(--warn); font-weight: 600; }
.gn-illus { margin: 4px 0; }
.gn-charge { margin: 0 0 6px; font-size: .875rem; color: var(--muted); }
.gn-cours { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--chip); font-size: .875rem; font-weight: 600; }
/* ===== Générateur Taïso : dosage modifiable, modèles, déjà fait (27/10/2026) ===== */
.gn-exo-l .gn-exo-btn + .gn-exo-btn { margin-left: 0; }
.gn-dosage { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 0; }
.gn-dosage label { flex: 1 0 100%; font-weight: 600; font-size: .875rem; }
.gn-dosage input { flex: 1 1 12em; min-width: 0; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
.gn-dosage .cs-btn.mini { min-height: 44px; min-width: 44px; }
.gn-nom-modele { flex: 1 1 100%; }
.gn-exo-usage { color: var(--muted); font-style: italic; }
.gn-modeles { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gn-modeles li { display: flex; align-items: center; gap: 6px; }
.gn-option.gn-modele { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.gn-modele small { color: var(--muted); font-weight: 400; font-size: .8125rem; }

      fiche ? h(Fiche, { e: fiche, espace: esp, fav: fav, usage: usages[fiche.id], sel: (cle === 'taiso' || cle === 'judo') ? sel : null, fermer: function () { setOuverte(null); } }) : null,
      genOuvert ? h(Generateur, { espace: esp.label, donnees: tous, tout: donnees, sous: f.sous, fermer: function () { setGenOuvert(false); },
        valider: function (ids, plan, infos) {
          if (sel.ids.length && !window.confirm('Remplacer les ' + sel.ids.length + ' exercices déjà dans « Ma séance » par la séance générée ?')) return false;
          if (!sel.set(ids)) return false;
          setGenere({ jeton: Date.now(), plan: plan, infos: infos }); setGenOuvert(false); return true;
        } }) : null)));
  }
  // Démarrage : base d'exercices, puis connexion (profil), puis exercices ajoutés du profil, puis l'app
  function Racine() {
    var s = React.useState(function () {
      var l = lireProfils(), ouvert = null; try { ouvert = sessionStorage.getItem('jsb-ouvert'); } catch (err) {}
      // Sans authentification : ouverture directe sur le premier profil de l'appareil (données d'origine), ou un espace local
      if (!AUTH_ACTIVE) { var q0 = l[0] || { id: 'local', prenom: 'Mon espace', nom: '', club: 'Judo Sans Barrière' }; activerProfil(q0, l.length ? l : [q0]); return 'chargement'; }
      var q = l.filter(function (x) { return x.id === ouvert; })[0];
      if (q) { activerProfil(q, l); return 'chargement'; }
      return 'connexion';
    }), phase = s[0], setPhase = s[1];
    React.useEffect(function () { if (phase === 'chargement') ajouterLocaux().then(function () { setPhase('app'); }); }, [phase]);
    if (phase === 'connexion') return h(Connexion, { entrer: function () { setPhase('chargement'); } });
    if (phase === 'chargement') return null;
    return h(App);
  }
  function demarrer() { ReactDOM.createRoot(document.getElementById('app')).render(h(Garde, null, h(Racine))); }
  var BASE_ORIGINE = null;
  // Exercices ajoutés depuis l'app (propres au profil actif) : fusionnés avec la base
  function ajouterLocaux() {
    if (!BASE_ORIGINE) BASE_ORIGINE = BASE;
    BASE = BASE_ORIGINE.slice();
    return chargerIllusIA().then(function () { return Stockage.lire(CLE_AJOUTS); }).then(function (a) {
      if (!Array.isArray(a) || !a.length) return;
      var ids = {}; BASE.forEach(function (e,i) { ids[e.id] = i; });
      a.forEach(function (e) { if (!e || !e.id) return;
        if (ids[e.id] !== undefined) { if (e._jsbOverride) BASE[ids[e.id]] = Object.assign({}, BASE[ids[e.id]], e, { ajoute: false }); }
        else { ids[e.id] = BASE.length; BASE.push(Object.assign({}, e, { ajoute: !e._jsbOverride })); }
      });
    }).catch(function () {}).then(chargerEnLigne);
  }
  (BASE_LOCALE && !BASE.length ? Stockage.lire('jsb-exercices').then(function (d) { if (Array.isArray(d) && d.length) BASE = d; }, function () {}) : Promise.resolve())
    .then(demarrer, demarrer);
})();
</script>

<script>
(function () {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) return;
  var dejaControle = !!navigator.serviceWorker.controller, propose = false;
  function proposer() {
    if (propose || !dejaControle) return; propose = true;
    var d = document.createElement('div'); d.id = 'maj-dispo'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>Nouvelle version de JSB Manager disponible.</span><button type="button">Mettre à jour</button>';
    d.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  navigator.serviceWorker.addEventListener('controllerchange', proposer);
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update().catch(function () {});
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    }).catch(function () {});
  });
})();
</script>
